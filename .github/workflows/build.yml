name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        # android-actions/setup-android@v3 已停止维护，与新 cmdline-tools 不兼容
        # (sdkmanager 报 Failed to find package 'tools')，改为接受 license，
        # 缺失的 platform/build-tools 由 Gradle 自动下载。
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "Android SDK licenses accepted at $ANDROID_HOME"

      - name: Decode signing keystore
        env:
          DRS_KEYSTORE_B64: ${{ secrets.DRS_KEYSTORE_B64 }}
        run: |
          mkdir -p keystore
          echo "$DRS_KEYSTORE_B64" | base64 -d > keystore/ramstatusbar-release.keystore
          echo "DRS_KEYSTORE_PATH=keystore/ramstatusbar-release.keystore" >> "$GITHUB_ENV"
          echo "keystore decoded: $(ls -la keystore/ramstatusbar-release.keystore)"

      - name: Grant execute permission for gradlew
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Verify APK signature
        run: |
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          certs=$("$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)
          echo "$certs"
          # 断言证书指纹与固定keystore一致(共用DeviceResetSpoofer的keystore)
          echo "$certs" | grep -q "d21cd192f0b2e4c0cd81b52db9b8b5e2fe62376fd87b13e374560f124ad7f843" \
            && echo "SIGNATURE OK: 与固定keystore指纹一致" \
            || { echo "SIGNATURE MISMATCH"; exit 1; }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RamStatusBar-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # ========= 仅当打 tag（v*）时：自动发布 Release =========
      - name: Package APK into ZIP (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./release-app-debug.apk
          zip RamStatusBar-debug-apk.zip release-app-debug.apk
          ls -la release-app-debug.apk RamStatusBar-debug-apk.zip

      - name: Create GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: RamStatusBar ${{ github.ref_name }}
          body_path: .github/RELEASE_BODY.md
          files: |
            release-app-debug.apk
            RamStatusBar-debug-apk.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
