plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.ramstatusbar'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.gjr787878.ramstatusbar"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Xposed API – only needed at compile time, provided by LSPosed/Vector at runtime
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'
}
