plugins {
    id 'com.android.application'
}

// 统一签名：本地与CI使用同一keystore，保证覆盖安装/升级
def keystorePath = System.getenv("DRS_KEYSTORE_PATH") ?: "keystore/ramstatusbar-release.keystore"
def keystorePass = System.getenv("DRS_KEYSTORE_PASS") ?: "DRS_Key_2026!"

android {
    namespace 'com.example.ramstatusbar'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.gjr787878.ramstatusbar"
        minSdk 26
        targetSdk 34
        versionCode 15
        versionName "1.4.2"
    }

    signingConfigs {
        release {
            // rootProject.file: 相对仓库根解析(keystore/目录在仓库根)
            storeFile rootProject.file(keystorePath)
            storePassword keystorePass
            keyAlias "devicereset"
            keyPassword keystorePass
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Xposed API – only needed at compile time, provided by LSPosed/Vector at runtime
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'
}
